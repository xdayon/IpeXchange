<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080C14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="IpêXchange — P2P marketplace for Ipê City. Buy, sell and trade with ETH on Base L2." />
    <meta property="og:title" content="IpêXchange" />
    <meta property="og:description" content="P2P marketplace for Ipê City. Buy, sell and trade with ETH on Base L2." />
    <meta property="og:type" content="website" />
    <title>IpêXchange — Ipê City Marketplace</title>

    <!-- Telegram Mini App SDK — must load before React -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Node.js polyfills for wallet/crypto libs -->
    <script>
      window.global = window.global ?? globalThis;
      window.process = window.process ?? { env: {}, version: '', versions: {} };
      window.Buffer = window.Buffer ?? { isBuffer: () => false };
    </script>

    <!-- Inline critical CSS to prevent flash -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #080C14; min-height: 100vh; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
      #root { min-height: 100vh; }
      /* Prevent scroll bounce on iOS inside Telegram */
      html { overflow: hidden; height: 100%; }
      body { overflow-y: auto; height: 100%; -webkit-overflow-scrolling: touch; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
